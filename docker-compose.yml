services:
  postgres:
    image: postgres:16-alpine
    container_name: echobloom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: echobloom
    ports:
      - "5432:5432"
    volumes:
      - echobloom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d echobloom"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  echobloom_pgdata:
